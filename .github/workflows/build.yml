name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: 🏗️ Create Flutter Android Scaffold
        run: |
          # إنشاء مشروع فلاتر مؤقت لتوليد مجلد android
          flutter create temp_app --project-name mamax_school_fees --platforms android
          
          # نسخ مجلد android إلى مشروعنا الأساسي
          cp -r temp_app/android ./
          
          # حذف المشروع المؤقت
          rm -rf temp_app
          
          # تعديل اسم التطبيق في AndroidManifest
          sed -i 's/android:label="mamax_school_fees"/android:label="رسومك الدراسية"/g' android/app/src/main/AndroidManifest.xml

          # إضافة الصلاحيات
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # تحديث إعدادات Android لتدعم المكتبات الجديدة (file_picker, pdf, printing)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔨 Build APK
        run: flutter build apk --release

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mamax-school-fees-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
